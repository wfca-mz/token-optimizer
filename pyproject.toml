[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokopt"
version = "0.1.0"
description = "Cut LLM token spend: park idle MCP servers/plugins and stop idle agent sessions (Claude Code, Codex, Hermes, Gemini)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.scripts]
tokopt = "tokopt.cli:main"
tokopt-nudge = "tokopt.nudge:main"

[tool.setuptools]
packages = ["tokopt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
